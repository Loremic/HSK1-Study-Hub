<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio HSK 1</title>
<style>
:root{
  --rosa:#fef1f2; --rosso:#d6202b; --inchiostro:#222; --grigio:#6b6b6b;
  --carta:#faf7f2; --linea:#e8e2d8; --bianco:#fff;
  --hanzi:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--inchiostro);background:var(--bianco);line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rosso);outline-offset:2px}

header{background:var(--rosa);border-bottom:3px solid var(--rosso);padding:18px 24px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
header h1{font-size:1.45rem;line-height:1.2}
header p{font-size:.85rem;color:var(--grigio)}
#q{width:min(360px,100%);padding:10px 14px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);font-size:1rem}

.layout{display:grid;grid-template-columns:270px 1fr;gap:0;max-width:1300px;margin:0 auto}
nav{padding:20px 14px 40px 24px;border-right:1px solid var(--linea);position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
nav h3{font-size:.95rem;color:var(--rosso);margin:18px 0 6px}
nav h3:first-child{margin-top:0}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:.92rem}
nav button:hover{background:var(--carta)}
nav button[aria-current="true"]{background:var(--rosa);color:var(--rosso);font-weight:600}
nav .n{color:var(--grigio);font-weight:400}

main{padding:22px 24px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.top h2{font-size:1.35rem}
.top span{color:var(--grigio);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;border:1px solid var(--rosso);border-radius:8px;overflow:hidden}
.seg button{background:var(--bianco);border:0;padding:7px 16px;cursor:pointer;color:var(--rosso)}
.seg button[aria-pressed="true"]{background:var(--rosso);color:var(--bianco)}
.tools label{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.btn{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--rosso);color:var(--rosso)}
#unitSelect{display:none;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);max-width:100%}

/* schede che si girano */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{perspective:900px;height:236px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:14px;overflow:auto}
.back{transform:rotateY(180deg)}
.no{font-size:.75rem;color:var(--grigio)}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.front .no{position:absolute;left:12px;top:10px}
.hz{font-family:var(--hanzi);font-size:3.4rem;line-height:1.1}
.py{color:var(--rosso);font-size:1.15rem}
.mean{font-weight:700;margin:2px 0 8px}
.ex{font-family:var(--hanzi);font-size:.95rem}
.expy{color:var(--rosso);font-size:.8rem}
.en{font-style:italic;font-size:.82rem;color:#444}

/* elenco */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:5rem 1fr;gap:4px 16px;padding:14px 4px;border-bottom:1px solid var(--linea)}
.row .hz{font-size:2.3rem;text-align:center}
.row .where{font-size:.75rem;color:var(--grigio)}
.msg{background:var(--rosa);border-left:4px solid var(--rosso);padding:14px 16px;border-radius:6px;max-width:60ch}
code{background:var(--carta);padding:1px 5px;border-radius:4px}

/* quiz */
.tabs{display:flex;gap:6px}
.tabs button{background:var(--bianco);border:1px solid var(--rosso);color:var(--rosso);border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--rosso);color:var(--bianco)}
#quizView,#pronView,#statView{max-width:760px;margin:0 auto;padding:24px 16px 70px}
#quizView h2,#pronView h2,#statView h2{margin-bottom:6px}
#pronView h3,#statView h3{font-size:1.05rem;color:var(--rosso);margin:26px 0 8px}
.srow{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea)}
.snd{display:flex;gap:8px;align-items:center;background:var(--carta);border:1px solid var(--linea);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.snd:hover{border-color:var(--rosso)}
.snd b{color:var(--rosso);min-width:2.4ch}
.snd .h{font-family:var(--hanzi);font-size:1.35rem;margin-left:auto}
.srow span.t{font-size:.92rem}
.rules{padding-left:20px;display:grid;gap:8px;font-size:.95rem}
.dr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--linea);text-align:left}
.tbl tr.ph td{background:var(--rosa);font-weight:700;color:var(--rosso)}
.tbl .bar{width:90px;display:inline-block;vertical-align:middle;margin:0 0 0 8px}
.tbl td.pc{width:46px;padding-right:0}
.play{width:34px;height:34px;border-radius:50%;border:0;background:var(--rosso);color:var(--bianco);cursor:pointer;font-size:.8rem;padding:0 0 0 2px;display:inline-flex;align-items:center;justify-content:center}
.play:hover{opacity:.85}
.tbl tr:hover td{background:var(--carta)}
@media (max-width:520px){.srow{grid-template-columns:1fr}}
.hint{color:var(--grigio);font-size:.9rem;margin:6px 0 14px}
.setup{display:grid;gap:12px;margin:16px 0}
.setup label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.setup select,.qin{padding:10px 12px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);font-size:1rem;width:100%}
.big{background:var(--rosso);color:var(--bianco);border-color:var(--rosso);padding:12px 26px;font-size:1.05rem;font-weight:600}
.big:hover{color:var(--bianco);opacity:.9}
.bar{height:6px;background:var(--linea);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--rosso)}
.qbox{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:22px 18px;margin:12px 0;text-align:center}
.qbig{font-family:var(--hanzi);font-size:3.6rem;line-height:1.2;overflow-wrap:anywhere}
.qbig.txt{font-family:inherit;font-size:1.5rem;font-weight:700}
.qbig.sen{font-size:1.7rem}
.ask{color:var(--grigio);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts button{background:var(--bianco);border:1px solid var(--linea);border-radius:10px;padding:14px 10px;cursor:pointer;font-size:1.1rem;min-height:56px}
.opts button.hz2{font-family:var(--hanzi);font-size:1.7rem}
.opts button:hover:not(:disabled){border-color:var(--rosso)}
.opts button.ok,.qin.ok{background:#e7f6ea;border-color:#2e8b47}
.opts button.no,.qin.no{background:#fde8e8;border-color:var(--rosso)}
.fb{border-left:4px solid var(--rosso);background:var(--rosa);border-radius:6px;padding:12px 14px;text-align:left;margin-top:14px}
.fb.good{border-color:#2e8b47;background:#e7f6ea}
.fb b{display:block;margin-bottom:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.errs{text-align:left;margin:12px 0;padding-left:20px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav{display:none}
  #unitSelect{display:block;margin-bottom:12px;width:100%}
  header,main{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Studio HSK 1</h1>
    <p>300 parole del nuovo syllabus, in ordine di studio</p>
  </div>
  <div class="tabs" role="group" aria-label="Sezione">
    <button id="tabStudia" aria-pressed="true">Studia</button>
    <button id="tabPron" aria-pressed="false">Pronuncia</button>
    <button id="tabQuiz" aria-pressed="false">Quiz</button>
    <button id="tabStat" aria-pressed="false">Statistiche</button>
  </div>
  <input id="q" type="search" placeholder="Cerca in hanzi, pinyin o italiano" aria-label="Cerca una parola" autocomplete="off">
</header>

<div class="layout">
  <nav id="nav" aria-label="Unità di studio"></nav>
  <main>
    <select id="unitSelect" aria-label="Scegli un’unità"></select>
    <div class="top"><h2 id="title">Tutte le parole</h2><span id="count"></span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Modalità di visualizzazione">
        <button id="vSchede" aria-pressed="true">Schede</button>
        <button id="vElenco" aria-pressed="false">Elenco</button>
      </div>
      <label id="pyWrap"><input type="checkbox" id="pyFront" checked> Pinyin sul fronte</label>
      <button class="btn" id="flipAll">Gira tutte</button>
    </div>
    <div id="grid" class="cards"></div>
  </main>
</div>
<section id="quizView" hidden aria-live="polite"></section>
<section id="pronView" hidden></section>
<section id="statView" hidden></section>

<script>
// Percorso del file dati, relativo a questa pagina (site/index.html → data/flashcards.json).
// Se hai messo il JSON altrove, cambia solo questa riga.
const DATA_URL = "../data/flashcards.json";

const $ = s => document.querySelector(s);
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const pad = n => String(n).padStart(3, "0");
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}

let cards = [], unit = "all", view = "schede", showPinyin = true, query = "";
const flipped = new Set();

fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { cards = d.sort((a, b) => a.order - b.order); buildNav(); render(); })
  .catch(() => {
    const m = el("div", "msg");
    m.append("Non riesco a caricare ", el("b", "", DATA_URL), ". Apri il sito da un server locale: dalla cartella principale del repository lancia ",
      el("code", "", "python -m http.server"), " e vai su ", el("code", "", "http://localhost:8000/site/"), ".");
    $("#grid").replaceChildren(m);
  });

function buildNav() {
  const phases = [];
  cards.forEach(c => {
    let p = phases.find(x => x.name === c.phase);
    if (!p) { p = { name: c.phase, units: [] }; phases.push(p); }
    let u = p.units.find(x => x.name === c.unit);
    if (!u) { u = { name: c.unit, n: 0 }; p.units.push(u); }
    u.n++;
  });
  const nav = $("#nav"), sel = $("#unitSelect");
  nav.replaceChildren(); sel.replaceChildren();

  const mk = (label, n, val) => {
    const b = el("button"); b.dataset.unit = val;
    b.append(el("span", "", label), el("span", "n", n));
    return b;
  };
  nav.append(mk("Tutte le parole", cards.length, "all"));
  sel.append(new Option("Tutte le parole (" + cards.length + ")", "all"));
  phases.forEach(p => {
    nav.append(el("h3", "", p.name));
    const g = document.createElement("optgroup"); g.label = p.name;
    p.units.forEach(u => {
      nav.append(mk(u.name, u.n, u.name));
      g.append(new Option(u.name + " (" + u.n + ")", u.name));
    });
    sel.append(g);
  });
  nav.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    setUnit(b.dataset.unit);
  });
  sel.addEventListener("change", () => setUnit(sel.value));
}

function setUnit(u) {
  unit = u; query = ""; $("#q").value = "";
  render(); window.scrollTo({ top: 0 });
}

function visible() {
  const q = norm(query.trim());
  if (q) return cards.filter(c => [c.hanzi, c.pinyin, c.meaning_it].some(f => norm(f).includes(q)));
  return cards.filter(c => unit === "all" || c.unit === unit);
}

function cardEl(c) {
  const b = el("button", "card" + (flipped.has(c.id) ? " flipped" : ""));
  b.setAttribute("aria-label", "Gira la scheda di " + c.hanzi);
  const inner = el("div", "inner");
  const f = el("div", "face front");
  f.append(el("span", "no", "#" + pad(c.order)), el("div", "hz", c.hanzi));
  if (showPinyin) f.append(el("div", "py", c.pinyin));
  const k = el("div", "face back");
  k.append(el("div", "py", c.pinyin), el("div", "mean", c.meaning_it));
  if (c.example) k.append(el("div", "ex", c.example.zh), el("div", "expy", c.example.pinyin), el("div", "en", c.example.en));
  inner.append(f, k); b.append(inner);
  b.addEventListener("click", () => {
    if (flipped.has(c.id)) flipped.delete(c.id); else flipped.add(c.id);
    b.classList.toggle("flipped");
  });
  return b;
}

function rowEl(c, withUnit) {
  const r = el("article", "row");
  r.append(el("div", "hz", c.hanzi));
  const d = el("div");
  if (withUnit) d.append(el("div", "where", "#" + pad(c.order) + " in " + c.unit));
  const l = el("div"); l.append(el("span", "py", c.pinyin + "  "), el("b", "", c.meaning_it));
  d.append(l);
  if (c.example) d.append(el("div", "ex", c.example.zh), el("div", "expy", c.example.pinyin), el("div", "en", c.example.en));
  r.append(d);
  return r;
}

function render() {
  const list = visible();
  $("#title").textContent = query ? "Risultati per “" + query.trim() + "”" : (unit === "all" ? "Tutte le parole" : unit);
  $("#count").textContent = list.length + (list.length === 1 ? " parola" : " parole");
  $("#unitSelect").value = unit;
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", String(!query && b.dataset.unit === unit)));
  const g = $("#grid");
  g.className = view === "schede" ? "cards" : "list";
  g.replaceChildren();
  if (!list.length) { g.append(el("div", "msg", "Nessuna parola trovata. Prova con hanzi, pinyin senza toni o una parola italiana.")); }
  const withUnit = unit === "all" || !!query;
  list.forEach(c => g.append(view === "schede" ? cardEl(c) : rowEl(c, withUnit)));
  $("#pyWrap").style.display = $("#flipAll").style.display = view === "schede" ? "" : "none";
  $("#vSchede").setAttribute("aria-pressed", String(view === "schede"));
  $("#vElenco").setAttribute("aria-pressed", String(view === "elenco"));
  $("#flipAll").textContent = list.length && list.every(c => flipped.has(c.id)) ? "Rimetti sul fronte" : "Gira tutte";
}

$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#vSchede").addEventListener("click", () => { view = "schede"; render(); });
$("#vElenco").addEventListener("click", () => { view = "elenco"; render(); });
$("#pyFront").addEventListener("change", e => { showPinyin = e.target.checked; render(); });
$("#flipAll").addEventListener("click", () => {
  const list = visible();
  const all = list.every(c => flipped.has(c.id));
  list.forEach(c => all ? flipped.delete(c.id) : flipped.add(c.id));
  render();
});

/* ================= QUIZ ================= */
// Progressi salvati nel browser (Leitner: ogni risposta giusta allunga l’intervallo di ripasso).
const LS = "hsk1.progress", DAY = 864e5, GAP = [0, 1, 2, 4, 8, 16, 32];
let prog = {}; try { prog = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
const saveProg = () => { try { localStorage.setItem(LS, JSON.stringify(prog)); } catch (e) {} };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const qv = $("#quizView");
let S = null;

const MODES = { mix: "Misto adattivo (consigliato)", h2m: "Hanzi → significato", m2h: "Significato → hanzi",
  h2p: "Hanzi → pinyin e toni", aud: "Ascolta e scegli l’hanzi", typ: "Scrivi il pinyin", clz: "Completa la frase" };

// Pinyin: accetta toni come segni (nǐ) o numeri (ni3); u: e v valgono ü.
const TM = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ" };
function canon(s) {
  s = s.normalize("NFC").toLowerCase().replace(/[\s'’\-]/g, "").replace(/u:|v/g, "ü");
  return s.replace(/([a-zü]+?)([0-5])/g, (m, syl, t) => {
    t = +t; if (t < 1 || t > 4) return syl;
    let i = syl.indexOf("a"); if (i < 0) i = syl.indexOf("e");
    if (i < 0 && syl.includes("ou")) i = syl.indexOf("o");
    if (i < 0) for (let k = syl.length - 1; k >= 0; k--) if ("aeiouü".includes(syl[k])) { i = k; break; }
    return i < 0 ? syl : syl.slice(0, i) + TM[syl[i]][t - 1] + syl.slice(i + 1);
  }).normalize("NFC");
}
const pinyinOk = (given, target) => target.split("/").some(t => canon(t) === canon(given));

// Sceglie la migliore voce cinese installata (le voci "Natural", "Neural" o Google suonano molto meglio).
let ZH = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const q = v => (/natural|neural|online|google|xiaoxiao|yunxi|ting-?ting|mei-?jia/i.test(v.name) ? 2 : 0) + (/zh[-_]CN/i.test(v.lang) ? 1 : 0);
  ZH = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang)).sort((a, b) => q(b) - q(a))[0] || null;
  const n = document.getElementById("voiceName");
  if (n) n.textContent = ZH ? "Voce in uso: " + ZH.name + " (" + ZH.lang + ")" : "Nessuna voce cinese trovata: installa una voce cinese nelle impostazioni del sistema per sentire i suoni.";
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function speak(t) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 0.8; if (ZH) u.voice = ZH;
  speechSynthesis.speak(u);
}
// "mǎ" → "ma3", "nǚ" → "nv3", "ma" → "ma5"
function numPinyin(p) {
  const T = { "\u0304": 1, "\u0301": 2, "\u030c": 3, "\u0300": 4 }; let t = 5, o = "";
  for (const ch of p.normalize("NFD").toLowerCase()) { if (T[ch]) t = T[ch]; else if (ch === "\u0308") o = o.slice(0, -1) + "v"; else if (/[a-z]/.test(ch)) o += ch; }
  return o + t;
}
// Se esiste una registrazione vera in site/audio/ (es. audio/ma3.mp3) la usa; altrimenti la voce del browser.
function playSound(py, h) {
  let done = false; const fallback = () => { if (!done) { done = true; speak(h); } };
  const a = new Audio("audio/" + numPinyin(py) + ".mp3");
  a.addEventListener("error", fallback); a.play().catch(fallback);
}

// Quattro risposte: i distrattori sono scelti tra parole simili (stessa unità, o pinyin con la stessa base ma toni diversi).
function choices(c, key) {
  const t = c[key], b = norm(t);
  const cand = shuffle(cards.filter(x => x.id !== c.id && x[key] !== t));
  cand.sort((x, y) => (key === "pinyin" ? (norm(y[key]) === b) - (norm(x[key]) === b) : 0) || (y.unit === c.unit) - (x.unit === c.unit));
  const out = [], seen = new Set([t]);
  for (const x of cand) { if (!seen.has(x[key])) { seen.add(x[key]); out.push(x); } if (out.length === 3) break; }
  return shuffle([c, ...out]).map(x => ({ label: x[key], ok: x.id === c.id }));
}

function makeQ(c, mode) {
  const box = (prog[c.id] || {}).box || 0; let t = mode;
  if (t === "mix") { const P = box < 2 ? ["h2m", "h2p", "aud"] : box < 4 ? ["m2h", "aud", "clz", "h2p"] : ["typ", "m2h", "clz", "aud"]; t = P[Math.floor(Math.random() * P.length)]; }
  if (t === "aud" && !("speechSynthesis" in window)) t = "h2p";
  if (t === "clz" && !(c.example && c.example.zh && c.example.zh.includes(c.hanzi))) t = "m2h";
  const q = { c, t, hz: false };
  if (t === "h2m") Object.assign(q, { big: c.hanzi, ask: "Che cosa significa?", opts: choices(c, "meaning_it") });
  if (t === "m2h") Object.assign(q, { big: c.meaning_it, txt: true, ask: "Qual è l’hanzi?", hz: true, opts: choices(c, "hanzi") });
  if (t === "h2p") Object.assign(q, { big: c.hanzi, ask: "Qual è il pinyin, con i toni giusti?", opts: choices(c, "pinyin") });
  if (t === "aud") Object.assign(q, { big: "🔊", ask: "Ascolta e scegli l’hanzi corretto", hz: true, opts: choices(c, "hanzi"), audio: c.hanzi });
  if (t === "typ") Object.assign(q, { big: c.hanzi, ask: "Scrivi il pinyin con i toni (puoi usare i numeri: ni3 hao3). Significato: " + c.meaning_it });
  if (t === "clz") Object.assign(q, { big: c.example.zh.replace(c.hanzi, "＿＿"), sen: true, ask: "Completa la frase. " + c.example.en, hz: true, opts: choices(c, "hanzi") });
  return q;
}

function stats() {
  const now = Date.now(), v = Object.values(prog);
  return { seen: v.length, known: v.filter(p => p.box >= 4).length, due: v.filter(p => p.due <= now).length };
}

function startQuiz(mode, scope, n, only) {
  const now = Date.now(), rank = c => !prog[c.id] ? 1 : prog[c.id].due <= now ? 0 : 2;
  let pool = only || (scope === "all" || scope === "smart" ? cards : cards.filter(c => c.unit === scope));
  if (!only) {
    pool = [...pool].sort((a, b) => rank(a) - rank(b) || (rank(a) === 1 ? a.order - b.order : prog[a.id].due - prog[b.id].due));
    if (scope === "smart") { const f = pool.filter(c => rank(c) < 2); pool = f.length ? f : pool; }
    if (n) pool = pool.slice(0, n);
  }
  if (!pool.length) { qv.replaceChildren(el("p", "msg", "Non ci sono parole da ripassare in questa selezione.")); return; }
  S = { mode, scope, queue: shuffle([...pool]), i: 0, score: 0, total: pool.length, seen: new Set(), again: new Set(), wrong: [], done: false };
  showQ();
}

function showQ() {
  if (S.i >= S.queue.length) return showResult();
  const q = S.cur = makeQ(S.queue[S.i], S.mode); S.done = false; qv.replaceChildren();
  const bar = el("div", "bar"), fill = el("i"); fill.style.width = (100 * S.i / S.queue.length) + "%"; bar.append(fill);
  qv.append(el("div", "hint", `Domanda ${S.i + 1} di ${S.queue.length}`), bar);
  const box = el("div", "qbox");
  box.append(el("div", "qbig" + (q.txt ? " txt" : "") + (q.sen ? " sen" : ""), q.big), el("div", "ask", q.ask));
  if (q.audio) { const b = el("button", "btn", "Riascolta"); b.addEventListener("click", () => speak(q.audio)); box.append(el("div", "acts")); box.lastChild.append(b); }
  if (q.opts) {
    const g = el("div", "opts");
    q.opts.forEach((o, k) => {
      const b = el("button", q.hz ? "hz2" : "", o.label); b.dataset.k = k;
      b.addEventListener("click", () => answer(o.ok, b)); g.append(b);
    });
    box.append(g);
  } else {
    const inp = el("input", "qin"); inp.id = "qin"; inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.setAttribute("aria-label", "Il tuo pinyin");
    const b = el("button", "btn big", "Controlla"); b.style.marginTop = "12px";
    const go = () => { if (inp.value.trim()) answer(pinyinOk(inp.value, q.c.pinyin), inp); };
    b.addEventListener("click", go); inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    box.append(inp, b); setTimeout(() => inp.focus(), 50);
  }
  qv.append(box);
  if (q.audio) speak(q.audio);
}

function answer(ok, node) {
  if (S.done) return; S.done = true;
  const c = S.cur.c, q = S.cur;
  if (!S.seen.has(c.id)) {
    S.seen.add(c.id);
    const p = prog[c.id] || { box: 0, due: 0, n: 0, miss: 0 };
    p.n++; if (ok) { p.box = Math.min(p.box + 1, GAP.length - 1); } else { p.box = 0; p.miss++; S.wrong.push(c); }
    p.due = Date.now() + GAP[p.box] * DAY; prog[c.id] = p; saveProg();
    if (ok) S.score++;
  }
  if (!ok && !S.again.has(c.id)) { S.again.add(c.id); S.queue.push(c); }  // riproposta a fine sessione
  if (q.opts) qv.querySelectorAll(".opts button").forEach((b, k) => { b.disabled = true; if (q.opts[k].ok) b.classList.add("ok"); else if (b === node) b.classList.add("no"); });
  else { node.disabled = true; node.classList.add(ok ? "ok" : "no"); qv.querySelector(".btn.big").style.display = "none"; }
  const fb = el("div", "fb" + (ok ? " good" : ""));
  fb.append(el("b", "", ok ? "Corretto!" : "Non proprio. Ecco la risposta giusta:"));
  fb.append(el("div", "", `${c.hanzi}  ${c.pinyin}: ${c.meaning_it}`));
  if (c.example) { fb.append(el("div", "ex", c.example.zh), el("div", "expy", c.example.pinyin), el("div", "en", c.example.en)); }
  const acts = el("div", "acts"), hear = el("button", "btn", "Ascolta"), nx = el("button", "btn big", "Avanti");
  hear.addEventListener("click", () => speak(c.hanzi)); nx.addEventListener("click", () => { S.i++; showQ(); });
  acts.append(hear, nx); qv.append(fb, acts); nx.focus();
}

function showResult() {
  const pct = Math.round(100 * S.score / S.total); qv.replaceChildren();
  qv.append(el("h2", "", "Quiz completato"), el("div", "qbox"));
  qv.lastChild.append(el("div", "qbig txt", `${S.score} su ${S.total} al primo tentativo (${pct}%)`));
  if (S.wrong.length) {
    qv.append(el("p", "hint", "Da ripassare (torneranno nei prossimi quiz):"));
    const ul = el("ul", "errs"); S.wrong.forEach(c => ul.append(el("li", "", `${c.hanzi}  ${c.pinyin}: ${c.meaning_it}`))); qv.append(ul);
  } else qv.append(el("p", "hint", "Nessun errore: ottimo lavoro."));
  const acts = el("div", "acts"), again = el("button", "btn big", "Ripassa gli errori"), menu = el("button", "btn", "Torna al menu");
  const { mode, wrong } = S; again.addEventListener("click", () => startQuiz(mode, "all", 0, wrong)); menu.addEventListener("click", quizMenu);
  if (wrong.length) acts.append(again); acts.append(menu); qv.append(acts);
}

/* ================= STATISTICHE ================= */
function agg(cs) {
  const now = Date.now(), a = { n: cs.length, seen: 0, known: 0, due: 0, tries: 0, miss: 0 };
  cs.forEach(c => { const p = prog[c.id]; if (!p) return; a.seen++; if (p.box >= 4) a.known++; if (p.due <= now) a.due++; a.tries += p.n; a.miss += p.miss; });
  return a;
}
function statsView() {
  tv.replaceChildren(el("h2", "", "Statistiche di studio"));
  const tot = agg(cards);
  tv.append(el("p", "hint", tot.seen ? `Hai visto ${tot.seen} parole su ${tot.n}; ${tot.known} sono consolidate e ${tot.due} aspettano un ripasso. I dati sono salvati in questo browser.` : "Fai un quiz e qui compariranno i progressi, area per area."));
  const rowOf = (label, a, cls) => {
    const tr = el("tr", cls), pct = a.n ? Math.round(100 * a.known / a.n) : 0, bar = el("div", "bar"), f = el("i");
    f.style.width = pct + "%"; bar.append(f);
    const k = el("td", "", `${a.known}/${a.n}`); k.append(bar);
    tr.append(el("td", "", label), el("td", "", a.seen + "/" + a.n), k, el("td", "", a.due), el("td", "", a.tries ? Math.round(100 * (a.tries - a.miss) / a.tries) + "%" : "–"));
    return tr;
  };
  const t = el("table", "tbl"), hd = el("tr");
  ["Area", "Viste", "Consolidate", "Da ripassare", "Precisione"].forEach(x => hd.append(el("th", "", x)));
  t.append(hd);
  [...new Set(cards.map(c => c.phase))].forEach(ph => {
    const pc = cards.filter(c => c.phase === ph); t.append(rowOf(ph, agg(pc), "ph"));
    [...new Set(pc.map(c => c.unit))].forEach(u => t.append(rowOf(u, agg(pc.filter(c => c.unit === u)))));
  });
  t.append(rowOf("Totale", tot, "ph"));
  const w = el("div", "wrap"); w.append(t); tv.append(w);
  tv.append(el("p", "hint", "Consolidate = parole indovinate più volte di fila, che tornano solo dopo 8 giorni o più. Precisione = risposte giuste al primo tentativo."));
  const hard = cards.filter(c => prog[c.id] && prog[c.id].miss > 0).sort((a, b) => prog[b.id].miss - prog[a.id].miss).slice(0, 10);
  tv.append(el("h3", "", "Le parole più difficili"));
  if (hard.length) {
    const ul = el("ul", "errs"); hard.forEach(c => ul.append(el("li", "", `${c.hanzi}  ${c.pinyin}: ${c.meaning_it} (${prog[c.id].miss} errori)`))); tv.append(ul);
    const b = el("button", "btn big", "Ripassa le più difficili"); b.addEventListener("click", () => { showTab("quiz"); startQuiz("mix", "all", 0, hard); }); tv.append(b);
  } else tv.append(el("p", "hint", "Nessun errore registrato finora."));
  const rs = el("button", "btn", "Azzera tutti i progressi"); rs.style.marginTop = "28px"; rs.style.display = "block";
  rs.addEventListener("click", () => { if (confirm("Vuoi cancellare tutti i progressi salvati in questo browser?")) { prog = {}; saveProg(); statsView(); } });
  tv.append(rs);
}

const TABS = { studia: "tabStudia", pron: "tabPron", quiz: "tabQuiz", stat: "tabStat" };
function showTab(t) {
  document.querySelector(".layout").style.display = t === "studia" ? "" : "none";
  qv.hidden = t !== "quiz"; pv.hidden = t !== "pron"; tv.hidden = t !== "stat";
  $("#q").style.visibility = t === "studia" ? "visible" : "hidden";
  Object.entries(TABS).forEach(([k, id]) => $("#" + id).setAttribute("aria-pressed", String(k === t)));
  const wait = () => el("p", "msg", "I dati non sono ancora caricati.");
  if (t === "pron" && !pv.childElementCount) buildPron();
  if (t === "quiz" && !S) { cards.length ? quizMenu() : qv.replaceChildren(wait()); }
  if (t === "stat") { cards.length ? statsView() : tv.replaceChildren(wait()); }
  window.scrollTo({ top: 0 });
}
Object.entries(TABS).forEach(([k, id]) => $("#" + id).addEventListener("click", () => showTab(k)));
</script>
